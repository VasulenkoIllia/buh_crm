<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buh_crm</title>
    <!--
      Inline SVG, not a file in public/: the app is served by Fastify from ./dist in production and
      by Vite in dev, and a data URI needs neither a static route nor a build step to behave the
      same in both. It also costs no request — the tab icon is drawn from the markup itself.
      The mark is a ledger page in the app's primary blue (#3355dd, --color-primary): two ruled
      lines and a total, which is what this product is about.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233355dd'/%3E%3Cg stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M10 11h12'/%3E%3Cpath d='M10 16h12'/%3E%3Cpath d='M10 21h7'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
